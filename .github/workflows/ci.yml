name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Unit tests
        run: python -m pytest
      - name: Verify preserved historical provenance
        run: python -c "import hashlib,pathlib; root=pathlib.Path('.'); lines=(root/'provenance/SHA256SUMS').read_text(encoding='utf-8').splitlines(); bad=[]; [(bad.append(str(p)) if (not p.is_file() or hashlib.sha256(p.read_bytes()).hexdigest()!=digest) else None) for line in lines if line.strip() for digest,name in [line.split(None,1)] for p in [root/name.strip()]]; assert not bad, bad"
      - name: Bounded hardware-free simulator
        timeout-minutes: 2
        run: wsprrypi-qualification simulate-qualification simulator-ci-runs --run-id 20260812T120000Z-ci-${{ matrix.os }}-${{ matrix.python-version }}
      - name: Configure hardware-free native capture tests
        run: cmake -S . -B build-native -DWSPQ_BUILD_SOAPY=OFF -DWSPQ_BUILD_TESTS=ON
      - name: Build hardware-free native capture tests
        run: cmake --build build-native --config Release
      - name: Run hardware-free native capture tests
        run: ctest --test-dir build-native -C Release --output-on-failure
      - name: Build distributions
        run: python -m build
      - name: Verify deployment and live-session assets in distributions
        run: python -c "import glob, zipfile; p=glob.glob('dist/*.whl')[0]; n=zipfile.ZipFile(p).namelist(); required=['wsprrypi_qualification/deployment.py','wsprrypi_qualification/simulator.py','wsprrypi_qualification/live_adapters.py','wsprrypi_qualification/real_session.py','wsprrypi_qualification/schemas/helper-deployment-config.schema.json','wsprrypi_qualification/schemas/deployment-provider-evidence.schema.json','wsprrypi_qualification/schemas/simulator-session.schema.json','wsprrypi_qualification/schemas/simulator-decode-summary.schema.json','wsprrypi_qualification/schemas/simulator-result.schema.json','wsprrypi_qualification/schemas/application-plan.schema.json','wsprrypi_qualification/schemas/real-session-stage-evidence.schema.json','wsprrypi_qualification/schemas/resolved-real-session-plan.schema.json','wsprrypi_qualification/deployment_assets/helper-config.example.json','wsprrypi_qualification/deployment_assets/wspq-capability-helper.service.in']; assert all(n.count(r)==1 for r in required), [r for r in required if n.count(r)!=1]"
      - name: Install wheel smoke test in isolated environment
        run: python scripts/ci_install_wheel_smoke.py
      - name: CLI smoke test
        run: wsprrypi-qualification version
