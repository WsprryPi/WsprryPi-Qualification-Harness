name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

  workflow_dispatch:
    inputs:
      pico_ref:
        description: Exact candidate Pico commit (40 lowercase hex characters)
        type: string
        default: f2153dfde20174c41da1782e5c14a019b51b192f

permissions:
  contents: read

defaults:
  run:
    working-directory: harness

env:
  WSPQ_PICO_REQUESTED_REF: ${{ inputs.pico_ref || 'f2153dfde20174c41da1782e5c14a019b51b192f' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          repository: WsprryPi/WsprryPico
          ref: ${{ env.WSPQ_PICO_REQUESTED_REF }}
          path: pico-candidate
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: harness/pyproject.toml
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Static checks
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy
      - name: Build selected Pico production fixtures
        # This builds production encoders/handlers, never a firmware SDK or RF.
        # The source checkout remains a sibling so static checks cover only this repository.
        run: python scripts/ci_pico_integration.py ../pico-candidate
      - name: Product acceptance
        run: python -m pytest
      - name: Build and verify distributions
        run: |
          python -m build
          python scripts/ci_install_wheel_smoke.py

  portability:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python-version: "3.13"
            pico_test_filter: "not never_selected"
          - os: windows-latest
            python-version: "3.11"
            pico_test_filter: "not production_usb"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - uses: actions/checkout@v7
        with:
          repository: WsprryPi/WsprryPico
          ref: ${{ env.WSPQ_PICO_REQUESTED_REF }}
          path: pico-candidate
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: harness/pyproject.toml
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Production Pico compiler and native capture contracts
        run: python scripts/ci_pico_integration.py ../pico-candidate
      - name: Portable interface tests
        run: >-
          python -m pytest
          tests/unit/test_application_cli.py
          tests/unit/test_bounded_tone_control.py
          tests/unit/test_cli.py
          tests/unit/test_complete_test.py
          tests/unit/test_noise.py
          tests/unit/test_quiet_carrier.py
          tests/unit/test_simultaneous_reference.py
          tests/unit/test_carrier.py
          tests/unit/test_prepared_release.py
          tests/unit/test_prepared_release_adapters.py
          tests/unit/test_lifecycle.py
          tests/unit/test_lifecycle_recipes.py
          tests/unit/test_paths.py
          tests/unit/test_pico_campaign.py
          tests/unit/test_pico_measurements.py
          tests/unit/test_pico_wire.py
          tests/unit/test_supervisor.py
          tests/unit/test_tool_discovery.py
          tests/unit/test_turnkey_campaign.py
          -k "${{ matrix.pico_test_filter }}"
