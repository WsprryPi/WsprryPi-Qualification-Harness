name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Unit tests
        run: python -m pytest
      - name: Configure hardware-free native capture tests
        run: cmake -S . -B build-native -DWSPQ_BUILD_SOAPY=OFF -DWSPQ_BUILD_TESTS=ON
      - name: Build hardware-free native capture tests
        run: cmake --build build-native --config Release
      - name: Run hardware-free native capture tests
        run: ctest --test-dir build-native -C Release --output-on-failure
      - name: Build distributions
        run: python -m build
      - name: Verify deployment assets in distributions
        run: python -c "import glob, zipfile; p=glob.glob('dist/*.whl')[0]; n=zipfile.ZipFile(p).namelist(); required=['wsprrypi_qualification/deployment.py','wsprrypi_qualification/schemas/helper-deployment-config.schema.json','wsprrypi_qualification/schemas/deployment-provider-evidence.schema.json','wsprrypi_qualification/deployment_assets/helper-config.example.json','wsprrypi_qualification/deployment_assets/wspq-capability-helper.service.in']; assert all(any(x.endswith(r) for x in n) for r in required)"
      - name: Install wheel smoke test in isolated environment
        run: python -c "import glob, pathlib, subprocess, sys, tempfile; d=pathlib.Path(tempfile.mkdtemp()); v=d/'venv'; subprocess.check_call([sys.executable,'-m','venv',str(v)]); p=v/('Scripts/python.exe' if sys.platform=='win32' else 'bin/python'); subprocess.check_call([str(p),'-m','pip','install',glob.glob('dist/*.whl')[0]]); subprocess.check_call([str(p),'-c','import wsprrypi_qualification.deployment'])"
      - name: CLI smoke test
        run: wsprrypi-qualification version
