name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Static checks
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy
      - name: Product tests
        run: python -m pytest
      - name: Build and verify distributions
        run: |
          python -m build
          python scripts/ci_install_wheel_smoke.py
      - name: Native capture contract
        run: |
          cmake -S . -B build-native -DWSPQ_BUILD_SOAPY=OFF -DWSPQ_BUILD_TESTS=ON
          cmake --build build-native --config Release
          ctest --test-dir build-native -C Release --output-on-failure

  portability:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Portable interface tests
        run: >-
          python -m pytest
          tests/unit/test_application_cli.py
          tests/unit/test_bounded_tone_control.py
          tests/unit/test_cli.py
          tests/unit/test_complete_test.py
          tests/unit/test_noise.py
          tests/unit/test_quiet_carrier.py
          tests/unit/test_simultaneous_reference.py
          tests/unit/test_carrier.py
          tests/unit/test_paths.py
          tests/unit/test_supervisor.py
          tests/unit/test_tool_discovery.py
          tests/unit/test_turnkey_campaign.py
      - name: Native capture contract
        run: |
          cmake -S . -B build-native -DWSPQ_BUILD_SOAPY=OFF -DWSPQ_BUILD_TESTS=ON
          cmake --build build-native --config Release
          ctest --test-dir build-native -C Release --output-on-failure
