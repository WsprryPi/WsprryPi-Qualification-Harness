[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wsprrypi-qualification"
version = "0.1.0.dev0"
description = "Cross-platform evidence foundation for WsprryPi transmitter qualification"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Lee Bussy"}]
dependencies = ["jsonschema>=4.23,<5", "numpy>=2.0,<2.4"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
]

[project.scripts]
wsprrypi-qualification = "wsprrypi_qualification.cli:main"
wspq-remote-exec = "wsprrypi_qualification.remote_exec:main"
wspq-capability-helper = "wsprrypi_qualification.capability_helper:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wsprrypi_qualification"]

[tool.hatch.build.targets.wheel.force-include]
"deployment/raspberry-pi-os/wspq-gpio-inspect" = "wsprrypi_qualification/deployment_assets/wspq-gpio-inspect"
"evidence-anchors/bounded-carrier-original-anchors.json" = "wsprrypi_qualification/evidence_anchors/bounded-carrier-original-anchors.json"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/CONTRACT.md",
  "/CMakeLists.txt",
  "/native",
  "/schemas",
  "/docs",
  "/pyproject.toml",
  "/requirements.txt",
  "/scripts",
  "/deployment",
  "/evidence-anchors",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
